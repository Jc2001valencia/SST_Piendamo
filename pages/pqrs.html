<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulario PQRS - SST Piendamó </title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-blue-800 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">SST Piendamó Tunía</h1>
      <a href="../index.html" class="hover:underline text-sm">Inicio</a>
    </div>
  </nav>

  <main class="container mx-auto p-6 flex-grow">
    <h2 class="text-3xl font-semibold mb-6 text-center">Formulario PQRS</h2>

   <form 
 id="reporteForm"
    action="https://formsubmit.co/alcaldiapiendamotuniasst@gmail.com" 
    method="POST"
    class="bg-white p-6 rounded shadow-md max-w-3xl mx-auto">

      <!-- Nombre completo -->
      <label for="nombre" class="block font-medium mb-1">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo"
             class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600" />

      <!-- Documento de identidad -->
      <label for="documento" class="block font-medium mb-1">Documento de identidad</label>
      <input type="text" id="documento" name="documento" required placeholder="Número de cédula"
             class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600" />

      <!-- Tipo de PQRS -->
      <label for="tipo" class="block font-medium mb-1">Tipo de PQRS</label>
      <select id="tipo" name="tipo" required
              class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600">
        <option value="" disabled selected>Seleccione un tipo</option>
        <option value="peticion">Petición</option>
        <option value="queja">Queja</option>
        <option value="reclamo">Reclamo</option>
        <option value="sugerencia">Sugerencia</option>
      </select>

      <!-- Descripción -->
      <label for="descripcion" class="block font-medium mb-1">Descripción</label>
      <textarea id="descripcion" name="descripcion" rows="5" required placeholder="Detalle aquí su petición, queja, reclamo o sugerencia"
                class="w-full p-3 border border-gray-300 rounded mb-6 resize-y focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>

      <!-- Correo electrónico -->
      <label for="correo" class="block font-medium mb-1">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com"
             class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600" />

      <!-- Teléfono -->
      <label for="telefono" class="block font-medium mb-1">Teléfono</label>
      <input type="tel" id="telefono" name="telefono" placeholder="Opcional"
             class="w-full p-3 border border-gray-300 rounded mb-6 focus:outline-none focus:ring-2 focus:ring-blue-600" />

      <!-- Botón Enviar -->
      <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-3 rounded font-semibold transition">
        Enviar PQRS
      </button>

    </form>
  </main>

 <!-- Footer -->
  <footer class="bg-blue-800 text-white text-center p-4">
    &copy; 2025 Alcaldía de Piendamó Tunía - SST 
  </footer>

   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.getElementById('reporteForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const submitBtn = this.querySelector('button[type="submit"]');
  const originalText = submitBtn.textContent;
  
  // Mostrar loader en el botón
  submitBtn.innerHTML = `
    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/1000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    Enviando...
  `;
  submitBtn.disabled = true;

  try {
    const response = await fetch(this.action, {
      method: 'POST',
      body: new FormData(this)
    });

    if (response.ok) {
      await Swal.fire({
        title: '¡Éxito!',
        text: 'El reporte se ha enviado correctamente',
        icon: 'success',
        iconColor: '#10B981', // verde-500
        confirmButtonColor: '#3B82F6', // azul-500
        confirmButtonText: 'Aceptar',
        background: '#FFFFFF',
        backdrop: `
          rgba(0,0,0,0.4)
          url("/images/checkmark.gif")
          center top
          no-repeat
        `,
        timer: 3000,
        timerProgressBar: true,
        willClose: () => {
          this.reset();
        }
      });
    } else {
      throw new Error('Error en el servidor');
    }
  } catch (error) {
    await Swal.fire({
      title: 'Error',
      text: 'No se pudo enviar el reporte: ' + error.message,
      icon: 'error',
      iconColor: '#EF4444', // rojo-500
      confirmButtonColor: '#3B82F6', // azul-500
      confirmButtonText: 'Entendido',
      background: '#FEF2F2' // rojo-50
    });
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
  }
});
</script>

</body>
</html>
